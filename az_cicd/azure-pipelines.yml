trigger:
  branches:
    include:
      - main
  paths:
    include:
      - az_cicd/*

pool:
  vmImage: 'ubuntu-latest'

variables:
  acrLoginServer: 'acrazcicdsec13385.azurecr.io'
  imageName: 'az-cicd-practice'
  imageTag: '$(Build.BuildId)'
  webAppName: 'az-cicd-security-15230'
  resourceGroup: 'rg-az-cicd-security'

stages:
  - stage: Build
    displayName: 'Build and Push to ACR'
    jobs:
      - job: BuildAndPush
        displayName: 'Build image and push to Container Registry'
        steps:
          - script: |
              echo "$(acrPassword)" | docker login $(acrLoginServer) -u $(acrUsername) --password-stdin
              docker build \
                --platform linux/amd64 \
                -t $(acrLoginServer)/$(imageName):$(imageTag) \
                -t $(acrLoginServer)/$(imageName):latest \
                az_cicd
              docker push $(acrLoginServer)/$(imageName):$(imageTag)
              docker push $(acrLoginServer)/$(imageName):latest
            displayName: 'Login, build and push - single step, same shell session'
            env:
              acrPassword: $(acrPassword)

          - script: |
              curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin v0.54.1
              trivy image \
                --username $(acrUsername) \
                --password $(acrPassword) \
                --severity CRITICAL,HIGH,MEDIUM \
                --format table \
                $(acrLoginServer)/$(imageName):$(imageTag)
            displayName: 'Trivy vulnerability scan (report only)'
            env:
              acrPassword: $(acrPassword)

  - stage: Deploy
    displayName: 'Deploy to App Service'
    dependsOn: Build
    jobs:
      - job: DeployToAppService
        displayName: 'Deploy container to Azure App Service'
        steps:
          - task: AzureWebAppContainer@1
            displayName: 'Deploy to Azure App Service'
            inputs:
              azureSubscription: 'azure-subscription-connection-security'
              appName: '$(webAppName)'
              containers: '$(acrLoginServer)/$(imageName):$(imageTag)'
