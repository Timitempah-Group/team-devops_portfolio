trigger:
  branches:
    include:
      - main
  paths:
    include:
      - az_cicd/*

pool:
  vmImage: 'ubuntu-latest'

variables:
  acrLoginServer: 'acrazcicdpractice25049.azurecr.io'
  imageName: 'az-cicd-practice'
  imageTag: '$(Build.BuildId)'
  webAppName: 'az-cicd-practice-v2'
  resourceGroup: 'rg-az-cicd-practice-v2'

stages:
  - stage: Build
    displayName: 'Build and Push to ACR'
    jobs:
      - job: BuildAndPush
        displayName: 'Build image and push to Container Registry'
        steps:
          - task: Docker@2
            displayName: 'Build and push Docker image'
            inputs:
              containerRegistry: 'acr-connection'
              repository: '$(imageName)'
              command: 'buildAndPush'
              Dockerfile: 'az_cicd/Dockerfile'
              buildContext: 'az_cicd'
              platform:
                os: 'linux'
                arch: 'amd64'
              tags: |
                $(imageTag)
                latest

  - stage: Deploy
    displayName: 'Deploy to App Service'
    dependsOn: Build
    jobs:
      - job: DeployToAppService
        displayName: 'Deploy container to Azure App Service'
        steps:
          - task: AzureWebAppContainer@1
            displayName: 'Deploy to Azure App Service'
            inputs:
              azureSubscription: 'azure-subscription-connection'
              appName: '$(webAppName)'
              containers: '$(acrLoginServer)/$(imageName):$(imageTag)'
