trigger:
  branches:
    include:
      - main
  paths:
    include:
      - az_cicd/*

pool:
  vmImage: 'ubuntu-latest'

variables:
  acrLoginServer: 'acrazcicdpractice25049.azurecr.io'
  imageName: 'az-cicd-practice'
  imageTag: '$(Build.BuildId)'
  webAppName: 'az-cicd-practice-v2'
  resourceGroup: 'rg-az-cicd-practice-v2'

stages:
  - stage: Build
    displayName: 'Build and Push to ACR'
    jobs:
      - job: BuildAndPush
        displayName: 'Build image and push to Container Registry'
        steps:
          - script: |
              echo "$(acrPassword)" | docker login $(acrLoginServer) -u $(acrUsername) --password-stdin
              docker build \
                -t $(acrLoginServer)/$(imageName):$(imageTag) \
                -t $(acrLoginServer)/$(imageName):latest \
                az_cicd
              docker push $(acrLoginServer)/$(imageName):$(imageTag)
              docker push $(acrLoginServer)/$(imageName):latest
            displayName: 'Login, build and push - all in one step, same shell session'
            env:
              acrPassword: $(acrPassword)

  - stage: Deploy
    displayName: 'Deploy to App Service'
    dependsOn: Build
    jobs:
      - job: DeployToAppService
        displayName: 'Deploy container to Azure App Service'
        steps:
          - task: AzureWebAppContainer@1
            displayName: 'Deploy to Azure App Service'
            inputs:
              azureSubscription: 'azure-subscription-connection'
              appName: '$(webAppName)'
              containers: '$(acrLoginServer)/$(imageName):$(imageTag)'
